name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 0.1.0 / 1.2.3（留空则自动从最新 vX.Y.Z 标签递增 patch；无历史标签时默认 0.1.0）'
        required: false
        default: ''
  # 提交(含版本 bump)推送到 main 时自动构建发布;该版本已打过 tag 则跳过
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            # 手动触发且指定了版本:直接使用,允许重发
            VERSION="${{ github.event.inputs.version }}"
            MODE="manual"
          else
            # push 触发或未填版本:读取 plugin.json 当前版本,自动构建发布
            VERSION="$(node -p "require('./plugin.json').version")"
            MODE="auto"
          fi
          # 校验语义化版本号
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "错误: 版本号必须是 vX.Y.Z 语义化版本(如 0.1.0), 收到: ${VERSION}" >&2
            exit 1
          fi
          # auto 模式:该版本已打过 tag 则跳过发布(避免每次 push 重复构建)
          if [ "${MODE}" = "auto" ] && git tag -l "v${VERSION}" | grep -q .; then
            echo "release=v0"
            echo "版本 v${VERSION} 已发布过,跳过"
          else
            echo "release=v1" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION} (${MODE})"

      - name: Update version in plugin.json / package.json
        if: steps.version.outputs.release == 'v1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            for (const f of ['plugin.json', 'package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf-8'));
              p.version = '${VERSION}';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          "

      - name: Build
        if: steps.version.outputs.release == 'v1'
        run: npm run build

      - name: Extract plugin info
        if: steps.version.outputs.release == 'v1'
        id: plugin_info
        run: |
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"
          echo "entryPath=${ENTRY_PATH}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release on this repo
        if: steps.version.outputs.release == 'v1'
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.plugin_info.outputs.zip_name }}"
          TAG="v${VERSION}"

          # 删除已存在的同名 Release / Tag(重发版兼容)
          if gh release view "${TAG}" &>/dev/null; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            --title "v${VERSION}" \
            --notes "自动构建的 JS 插件 v${VERSION}"

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Commit version bump on current branch
        if: steps.version.outputs.release == 'v1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOWNLOAD_URL="${{ steps.create_release.outputs.download_url }}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.version = '${VERSION}';
            p.download_url = '${DOWNLOAD_URL}';
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json
          git diff --staged --quiet || git commit -m "chore(release): bump to v${VERSION}"
          git push

