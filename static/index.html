<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChKSz 音源</title>
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --md-primary: #5b5fc7;
            --md-on-primary: #ffffff;
            --md-primary-container: #e0e0fb;
            --md-on-primary-container: #1a1b3d;
            --md-surface: #ffffff;
            --md-surface-1: #f7f7fb;
            --md-surface-2: #efeff4;
            --md-surface-variant: #e7e7ee;
            --md-on-surface: #1f1f1f;
            --md-on-surface-variant: #666666;
            --md-outline: #c9c9d4;
            --md-outline-variant: #e0e0e0;
            --md-error: #b3261e;
            --md-shadow-1: 0 1px 3px rgba(0,0,0,.12);
            --md-shadow-2: 0 4px 12px rgba(0,0,0,.18);
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-full: 999px;
        }
        [data-theme="dark"] {
            --md-primary: #c3c4ff;
            --md-on-primary: #2a2a55;
            --md-primary-container: #3a3a6a;
            --md-on-primary-container: #e3e3ff;
            --md-surface: #1b1b1f;
            --md-surface-1: #232327;
            --md-surface-2: #2b2b30;
            --md-surface-variant: #2e2e34;
            --md-on-surface: #e6e6e6;
            --md-on-surface-variant: #a8a8b3;
            --md-outline: #4a4a55;
            --md-outline-variant: #35353c;
            --md-error: #f2b8b5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
            background: var(--md-surface-1); color: var(--md-on-surface); line-height: 1.5;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        /* 视图用文档流布局(非 fixed):Android WebView 键盘弹出时页面自然收缩,输入框不被遮挡 */
        .view {
            flex: 1; min-height: 0; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .view.hidden { display: none; }

        /* ===== 顶部栏 ===== */
        /* 注意:.search-bar 不能叫 .app-bar——宿主 components.css 在 embed 模式下
           会执行 html.embed .app-bar { display: none !important; },把搜索框整行藏掉 */
        .app-bar, .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; flex: 0 0 auto;
            z-index: 10;
        }
        .app-bar .app-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(127,127,157,.14); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto;
        }
        .app-bar .app-icon img { width: 20px; height: 20px; }
        .app-bar .bar-title { font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-icon {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: transparent; color: inherit;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0; flex: 0 0 auto;
        }
        .btn-icon .material-symbols-outlined { font-size: 24px; }
        .btn-filled {
            padding: 9px 16px; border: 0; border-radius: var(--md-radius-sm);
            background: var(--md-primary); color: var(--md-on-primary);
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-filled:disabled { opacity: .5; cursor: not-allowed; }
        .btn-text {
            padding: 8px 12px; border: 0; border-radius: var(--md-radius-sm);
            background: transparent; color: var(--md-primary);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .text-field {
            flex: 1; width: 100%; padding: 9px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface); min-width: 0;
        }
        .text-field:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
        .text-area {
            width: 100%; min-height: 84px; resize: vertical;
            padding: 10px 12px; font-size: 13px; line-height: 1.5;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
            font-family: inherit;
        }
        .text-area:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
        .select-field {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
        }
        .platform-select {
            flex: 0 0 auto; width: 112px; padding: 8px 10px; font-size: 12px;
            color-scheme: light dark;
            background-color: var(--md-surface); color: var(--md-on-surface);
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
        }
        .platform-select option {
            background-color: var(--md-surface); color: var(--md-on-surface);
        }

        /* 平台多选 chips */
        .platform-bar {
            display: flex; gap: 8px; padding: 10px 14px 2px;
            flex: 0 0 auto; flex-wrap: wrap;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: var(--md-radius-full);
            border: 1px solid var(--md-outline); background: var(--md-surface);
            color: var(--md-on-surface-variant); font-size: 13px; font-weight: 500;
            cursor: pointer; user-select: none; -webkit-user-select: none;
        }
        .chip .material-symbols-outlined { font-size: 15px; }
        .chip.on { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }

        /* ===== 搜索视图 ===== */
        #searchView { background: var(--md-surface-1); }
        #searchView .search-bar { background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant); }
        .container { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
        .status { font-size: 13px; padding: 4px 2px 8px; min-height: 18px; }
        .status.ok { color: #2e7d32; } [data-theme="dark"] .status.ok { color: #81c784; }
        .status.err { color: #c62828; } [data-theme="dark"] .status.err { color: #ef9a9a; }
        .status.muted { color: var(--md-on-surface-variant); }
        .song-row {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 4px; border-bottom: 1px solid var(--md-outline-variant);
        }
        .song-row:last-child { border-bottom: none; }
        .song-cover {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            object-fit: cover; flex: 0 0 auto; background: var(--md-surface-variant);
        }
        .song-cover-ph {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            background: var(--md-surface-variant); color: var(--md-on-surface-variant);
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .song-cover-ph .material-symbols-outlined { font-size: 20px; }
        .song-meta { flex: 1; min-width: 0; }
        .song-title2 { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub2 { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 28px 0; }

        /* ===== 底部面板(队列/歌词/音量/配置) ===== */
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; }
        .urs-login-sheet { height: min(88vh, 760px); }
        .urs-login-frame { flex: 1; min-height: 0; width: min(440px, calc(100% - 24px)); margin: 0 auto; position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--md-outline-variant); background: #fff; }
        .urs-login-frame iframe { display: block; border: 0; width: 100%; height: 100%; }
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
            background: var(--md-surface); border-radius: 18px 18px 0 0;
            box-shadow: 0 -8px 32px rgba(0,0,0,.22);
            display: flex; flex-direction: column;
            max-height: 72vh;
            transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
        }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--md-outline); margin: 8px auto 2px; flex: 0 0 auto; }
        .sheet-title { padding: 10px 18px 8px; font-size: 15px; font-weight: 600; flex: 0 0 auto; }
        .sheet-body { padding: 0 8px 14px; overflow-y: auto; flex: 1; }

        /* 配置:一级菜单 / 二级菜单(类似手机设置) */
        .config-menu { padding: 6px 10px 12px; overflow-y: auto; flex: 1; }
        .config-menu-row {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 13px 12px; border: 0; border-bottom: 1px solid var(--md-outline-variant);
            background: transparent; color: var(--md-on-surface); text-align: left; cursor: pointer;
        }
        .config-menu-row:last-child { border-bottom: none; }
        .config-menu-row .material-symbols-outlined:first-child { color: var(--md-primary); font-size: 22px; }
        .config-menu-row .material-symbols-outlined:last-child { color: var(--md-on-surface-variant); font-size: 20px; }
        .config-menu-row .cm-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .config-menu-row .cm-title { font-size: 14px; font-weight: 500; }
        .config-menu-row .cm-sub { font-size: 12px; color: var(--md-on-surface-variant); }
        .config-subpage { display: flex; flex-direction: column; overflow-y: auto; flex: 1; }
        .config-back {
            display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
            padding: 10px 14px 2px; border: 0; background: transparent; color: var(--md-primary);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .config-back .material-symbols-outlined { font-size: 18px; }
        .dialog-body { padding: 14px 18px 4px; }
        .dialog-body label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
        .dialog-body label:first-child { margin-top: 0; }
        .dialog-hint { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
        .dialog-status { padding: 8px 18px 0; font-size: 13px; min-height: 18px; }
        .dialog-status.ok { color: #2e7d32; } [data-theme="dark"] .dialog-status.ok { color: #81c784; }
        .dialog-status.err { color: #c62828; } [data-theme="dark"] .dialog-status.err { color: #ef9a9a; }
        .sheet-footer { padding: 10px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; }

        /* 歌单选择 */
        .pl-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px; cursor: pointer;
        }
        .pl-row:hover { background: rgba(99,102,241,.07); }
        .pl-row .pl-icon {
            width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
            background: rgba(99,102,241,.14); color: var(--md-primary);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .pl-row .pl-icon .material-symbols-outlined { font-size: 20px; }
        .pl-row .pl-meta { flex: 1; min-width: 0; }
        .pl-row .pl-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-check { color: var(--md-primary); }

        /* ===== 首页浏览(平台标签 + 猜你喜欢/推荐歌单/排行榜) ===== */
        .browse-tabs { display: flex; gap: 8px; padding: 10px 14px 0; flex: 0 0 auto; }
        .browse-tab {
            padding: 7px 18px; border-radius: var(--md-radius-full);
            border: 1px solid var(--md-outline); background: var(--md-surface);
            color: var(--md-on-surface-variant); font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .browse-tab.on { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }
        .browse { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 68px; }
        .browse-module { margin-bottom: 18px; }
        .browse-module-title {
            font-size: 15px; font-weight: 700; margin: 2px 0 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .browse-module-title .material-symbols-outlined { font-size: 18px; color: var(--md-primary); }
        .browse-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
        .browse-card { min-width: 0; cursor: pointer; }
        @media (min-width: 700px) {
            .browse-cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
        @media (min-width: 1200px) {
            .browse-cards { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        .browse-card .bc-cover {
            width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover;
            background: var(--md-surface-variant); display: block;
        }
        .browse-card .bc-name {
            font-size: 12px; margin-top: 5px; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .browse-card .bc-meta { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; }
        .browse-rank { display: flex; flex-direction: column; }
        /* 批量导入曲库按钮 */
        .batch-bar { padding: 4px 0 10px; }
        .batch-bar .btn-filled { width: 100%; }
        .batch-actions { display: flex; gap: 6px; }
        .batch-actions .btn-filled { flex: 1; width: auto; padding: 8px 6px; font-size: 12px; }
        .batch-actions .btn-outlined { padding: 8px 6px; font-size: 12px; min-width: 0; }
        .login-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .login-actions .btn-outlined { flex: 1; min-width: 120px; }
        .btn-outlined {
            flex: 1; padding: 9px 14px; border: 1px solid var(--md-outline);
            border-radius: var(--md-radius-sm); background: var(--md-surface);
            color: var(--md-primary); font-size: 14px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
        }
        .btn-outlined:disabled { opacity: .5; cursor: not-allowed; }

        .browse-rank-row {
            display: flex; align-items: center; gap: 12px; padding: 7px 4px;
            border-bottom: 1px solid var(--md-outline-variant); cursor: pointer;
        }
        .browse-rank-row:last-child { border-bottom: none; }
        .browse-rank-idx {
            width: 26px; text-align: right; font-size: 14px; font-weight: 700;
            color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; flex: 0 0 auto;
        }
        .browse-rank-idx.top { color: var(--md-primary); }
        .browse-rank-cover { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--md-surface-variant); flex: 0 0 auto; }
        .browse-rank-meta { flex: 1; min-width: 0; }
        .browse-rank-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .browse-rank-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .browse-loading, .browse-error { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 24px 0; }
        .browse-error { color: #c62828; } [data-theme="dark"] .browse-error { color: #ef9a9a; }

        /* 歌单详情 */
        .browse-detail-back {
            display: flex; align-items: center; gap: 4px; padding: 2px 0 10px;
            font-size: 13px; font-weight: 600; color: var(--md-primary); cursor: pointer;
        }
        .browse-detail-back .material-symbols-outlined { font-size: 18px; }
        .browse-detail-head { display: flex; align-items: center; gap: 12px; padding: 0 0 12px; }
        .browse-detail-cover { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--md-surface-variant); flex: 0 0 auto; }
        .browse-detail-title { font-size: 15px; font-weight: 700; }
        .browse-detail-sub { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; }

        /* Snackbar */
        .snackbar {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px);
            background: var(--md-on-surface); color: var(--md-surface);
            padding: 10px 18px; border-radius: var(--md-radius-full);
            font-size: 13px; box-shadow: var(--md-shadow-2); z-index: 300;
            opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: 88vw;
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== 歌词 ===== */
        .lyric-source-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .lyric-source-row {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface);
        }
        .lyric-source-row .ls-name { flex: 1; font-size: 13px; font-weight: 500; }
        .lyric-source-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--md-primary); }
        .lyric-source-row .ls-op { display: flex; gap: 2px; }
        .lyric-source-row .btn-icon { width: 30px; height: 30px; }
        .lyric-source-row .btn-icon .material-symbols-outlined { font-size: 19px; }
        .lyric-content { margin-top: 8px; }
        .lyric-pre {
            white-space: pre-wrap; word-break: break-word; font-family: inherit;
            font-size: 13px; line-height: 1.7; max-height: 46vh; overflow-y: auto;
            background: var(--md-surface-1); border-radius: var(--md-radius-sm);
            padding: 10px 12px; color: var(--md-on-surface);
        }
        .lyric-meta { font-size: 12px; color: var(--md-on-surface-variant); margin-bottom: 8px; }
        .lyric-result-row {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 8px; border-bottom: 1px solid var(--md-outline-variant);
        }
        .lyric-result-row:last-child { border-bottom: none; }
        .lyric-result-meta { flex: 1; min-width: 0; }
        .lyric-result-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lyric-result-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    </style>
    <script>
      (function () {
        function applyTheme(t) {
          const theme = (t || '').toString().toLowerCase();
          if (theme !== 'dark' && theme !== 'light') return;
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('songloft-theme', theme); } catch (e) {}
        }
        window.addEventListener('message', function (e) {
          if (e && e.data && e.data.type === 'songloft-theme') applyTheme(e.data.theme);
        });
        const existing = document.documentElement.getAttribute('data-theme');
        const saved = (function () { try { return localStorage.getItem('songloft-theme'); } catch (e) { return null; } })();
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(existing || saved || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
</head>
<body>
    <!-- ===== 搜索视图(默认打开,搜索框直达) ===== -->
    <div class="view" id="searchView">
        <header class="search-bar">
            <input type="text" class="text-field" id="searchInput" placeholder="搜索歌手、歌曲…" onkeydown="if(event.key==='Enter')window.searchGo&&searchGo()">
            <button class="btn-filled" id="searchGoBtn" onclick="window.searchGo&&searchGo()">搜索</button>
            <select class="select-field platform-select" id="platformSelect" title="选择搜索平台">
                <option value="wy">网易云音乐</option>
                <option value="tx">QQ音乐</option>
                <option value="kg">酷狗音乐</option>
                <option value="all">聚合搜索</option>
            </select>
            <button class="btn-icon" id="configBtn2" title="插件设置(API Key / 音质 / 歌词接口 / 网易云登录 / 导入歌单链接)"><span class="material-symbols-outlined">settings</span></button>
        </header>
        <div class="browse-tabs" id="browseTabs"></div>
        <div class="browse" id="browse"><div class="browse-loading">加载中…</div></div>
        <!-- 搜索结果容器:默认隐藏,搜索时显示(首页浏览区占满屏幕) -->
        <div class="container" id="searchContainer" style="display:none">
            <div class="status muted" id="searchStatus"></div>
            <div id="results"></div>
        </div>
    </div>

    <!-- ===== 配置弹窗(左上角图标) ===== -->
    <div class="menu-backdrop" id="configBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="configSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">插件设置</div>

        <!-- 一级菜单:按行分布,类似手机设置 -->
        <div class="config-menu" id="configMenu">
            <button type="button" class="config-menu-row" data-target="basic">
                <span class="material-symbols-outlined">key</span>
                <span class="cm-text">
                    <span class="cm-title">基本设置</span>
                    <span class="cm-sub">API Key / 音质 / 歌单导入</span>
                </span>
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
            <button type="button" class="config-menu-row" data-target="lyric">
                <span class="material-symbols-outlined">lyrics</span>
                <span class="cm-text">
                    <span class="cm-title">歌词设置</span>
                    <span class="cm-sub">启用开关 / 接口优先级</span>
                </span>
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
            <button type="button" class="config-menu-row" data-target="netease">
                <span class="material-symbols-outlined">person</span>
                <span class="cm-text">
                    <span class="cm-title">网易云登录</span>
                    <span class="cm-sub">扫码 / 网页 / Cookie 登录</span>
                </span>
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <!-- 二级菜单:基本设置 -->
        <div class="config-subpage" id="configPageBasic" style="display:none">
            <button type="button" class="config-back" data-back="1"><span class="material-symbols-outlined">arrow_back</span> 返回</button>
            <div class="dialog-body">
                <label for="apiKey">API Key</label>
                <input type="password" class="text-field" id="apiKey" placeholder="api.chksz.com 登录后获取" autocomplete="off">
                <div class="dialog-hint" id="apiKeyHint">Key 保存在服务端,不会写入插件代码</div>
                <label for="quality">默认音质</label>
                <select class="select-field" id="quality">
                    <option value="flac">无损 (FLAC)</option>
                    <option value="320k">高品质 (320 kbps)</option>
                    <option value="128k">标准 (128 kbps)</option>
                </select>
                <div class="dialog-hint">网易云: lossless / exhigh / standard;QQ·酷狗: flac / 320k / 128k</div>
                <label>歌单导入</label>
                <button type="button" class="btn-outlined" id="importLinkFromConfigBtn" style="width:100%">导入歌单链接</button>
            </div>
        </div>

        <!-- 二级菜单:歌词设置 -->
        <div class="config-subpage" id="configPageLyric" style="display:none">
            <button type="button" class="config-back" data-back="1"><span class="material-symbols-outlined">arrow_back</span> 返回</button>
            <div class="dialog-body">
                <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
                    <input type="checkbox" id="lyricsEnabled" style="width:17px;height:17px;accent-color:var(--md-primary)">
                    <span>启用歌词搜索（无歌词时自动获取）</span>
                </label>
                <label>歌词接口（优先级）</label>
                <div class="dialog-hint">选中要启用的歌词接口，可用 ↑↓ 调整优先级；前面的接口优先尝试。</div>
                <div id="lyricSourcesList" class="lyric-source-list"></div>
                <button type="button" class="btn-outlined" id="openLyricSearchBtn" style="width:100%;margin-top:8px">打开歌词搜索</button>
            </div>
        </div>

        <!-- 二级菜单:网易云登录 -->
        <div class="config-subpage" id="configPageNetease" style="display:none">
            <button type="button" class="config-back" data-back="1"><span class="material-symbols-outlined">arrow_back</span> 返回</button>
            <div class="dialog-body">
                <label>网易云登录</label>
                <div class="dialog-hint" id="wyLoginStatus">未登录</div>
                <div class="login-actions">
                    <button type="button" class="btn-outlined" id="wyQrLoginBtn">扫码登录</button>
                    <button type="button" class="btn-outlined" id="wyWebLoginBtn">网页登录</button>
                    <button type="button" class="btn-outlined" id="wyCookieLoginBtn">Cookie 导入</button>
                    <button type="button" class="btn-text" id="wyLogoutBtn" style="display:none">退出登录</button>
                </div>
            </div>
        </div>

        <div class="dialog-status" id="configStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="configCancelBtn">取消</button>
            <button class="btn-filled" id="saveConfigBtn">保存</button>
        </div>
    </div>

    <!-- ===== 收藏到歌单面板 ===== -->
    <div class="menu-backdrop" id="playlistBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="playlistSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">收藏到歌单</div>
        <div class="sheet-body" id="playlistList"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="playlistCancelBtn">取消</button>
        </div>
    </div>

    <!-- ===== 导入歌单到宿主面板 ===== -->
    <div class="menu-backdrop" id="importBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="importSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">导入歌单到 Songloft</div>
        <div class="dialog-body">
            <div class="dialog-hint" id="importSourceInfo"></div>
            <label for="importPlaylistName">歌单名称</label>
            <input type="text" class="text-field" id="importPlaylistName" placeholder="输入歌单名称" maxlength="60">
            <div class="dialog-hint">歌曲会先导入曲库（已存在自动去重），然后创建同名歌单。</div>
        </div>
        <div class="dialog-status" id="importStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="importCancelBtn">取消</button>
            <button class="btn-filled" id="importConfirmBtn">开始导入</button>
        </div>
    </div>

    <!-- ===== 网易云扫码登录面板 ===== -->
    <div class="menu-backdrop" id="wyQrBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="wyQrSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">网易云扫码登录</div>
        <div class="dialog-body" style="text-align:center">
            <img id="wyQrImg" alt="网易云登录二维码" style="width:220px;height:220px;border-radius:12px;background:var(--md-surface-variant)">
            <div class="dialog-hint" id="wyQrHint">获取二维码中…</div>
            <a id="wyQrLink" href="#" target="_blank" rel="noopener" class="dialog-hint" style="display:none;color:var(--md-primary)">不方便扫码？点击打开网易云登录页</a>
        </div>
        <div class="dialog-status" id="wyQrStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="wyQrCancelBtn">取消</button>
        </div>
    </div>

    <!-- ===== 网易云网页登录(官方 URS 组件:手机验证码 / 手机密码) ===== -->
    <div class="menu-backdrop" id="wyWebBackdrop" style="display:none"></div>
    <div class="bottom-sheet urs-login-sheet" id="wyWebSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">网易云网页登录</div>
        <div class="urs-login-frame" id="wyWebUrsBox"></div>
        <div class="dialog-status" id="wyWebStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="wyWebReloadBtn">刷新页面</button>
            <button class="btn-text" id="wyWebCancelBtn">关闭</button>
        </div>
    </div>

    <!-- ===== 网易云 Cookie 导入面板(独立方式) ===== -->
    <div class="menu-backdrop" id="wyCookieBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="wyCookieSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">网易云 Cookie 导入</div>
        <div class="dialog-body">
            <label for="wyCookieInput">MUSIC_U / Cookie</label>
            <textarea class="text-area" id="wyCookieInput" placeholder="粘贴 MUSIC_U 的值，或整段 Cookie"></textarea>
            <div class="dialog-hint">与网页登录无关；适合你已从浏览器中获取 Cookie 的场景。</div>
        </div>
        <div class="dialog-status" id="wyCookieStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="wyCookieCancelBtn">取消</button>
            <button class="btn-filled" id="wyCookieSaveBtn">验证并登录</button>
        </div>
    </div>

    <!-- ===== 分享链接导入歌单面板 ===== -->
    <div class="menu-backdrop" id="linkImportBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="linkImportSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">导入歌单链接</div>
        <div class="dialog-body">
            <label for="linkImportUrl">分享链接 / 分享文本</label>
            <textarea class="text-area" id="linkImportUrl" placeholder="粘贴网易云、QQ音乐或酷狗的分享链接，例如：&#10;分享歌单: xxx https://music.163.com/m/playlist?id=7244423285"></textarea>
            <div class="dialog-hint">自动识别平台和歌单 ID，无需手动选择。</div>
            <label for="linkImportName">歌单名称（可选）</label>
            <input type="text" class="text-field" id="linkImportName" placeholder="留空则使用源歌单名称" maxlength="60">
        </div>
        <div class="dialog-status" id="linkImportStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="linkImportCancelBtn">取消</button>
            <button class="btn-filled" id="linkImportConfirmBtn">解析并导入</button>
        </div>
    </div>

    <!-- ===== 新建歌单面板 ===== -->
    <div class="menu-backdrop" id="createBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="createSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">新建歌单</div>
        <div class="dialog-body">
            <label for="createName">歌单名称</label>
            <input type="text" class="text-field" id="createName" placeholder="输入歌单名称" maxlength="40">
        </div>
        <div class="dialog-status" id="createStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="createCancelBtn">取消</button>
            <button class="btn-filled" id="createConfirmBtn">创建并收藏</button>
        </div>
    </div>

    <!-- ===== 歌词搜索 / 重新获取面板 ===== -->
    <div class="menu-backdrop" id="lyricBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="lyricSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">歌词</div>
        <div class="dialog-body">
            <div id="lyricSearchBar">
                <label for="lyricSearchInput">搜索歌名 / 歌手</label>
                <input type="text" class="text-field" id="lyricSearchInput" placeholder="输入歌名或「歌手 歌名」搜索歌词" maxlength="100">
                <button type="button" class="btn-filled" id="lyricSearchBtn" style="width:100%;margin-top:8px">搜索</button>
            </div>
            <div id="lyricResultBar">
                <div style="display:flex;gap:8px;margin:10px 0 6px;align-items:center">
                    <select class="select-field" id="lyricSource" style="flex:1;width:auto"></select>
                    <button type="button" class="btn-filled" id="lyricRefetchBtn" style="white-space:nowrap">用此接口获取</button>
                </div>
            </div>
            <div class="dialog-hint" id="lyricStatus"></div>
            <div id="lyricContent" class="lyric-content"></div>
        </div>
        <div class="sheet-footer">
            <button class="btn-text" id="lyricCloseBtn">关闭</button>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
