<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChKSz 音源</title>
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --md-primary: #5b5fc7;
            --md-on-primary: #ffffff;
            --md-primary-container: #e0e0fb;
            --md-on-primary-container: #1a1b3d;
            --md-surface: #ffffff;
            --md-surface-1: #f7f7fb;
            --md-surface-2: #efeff4;
            --md-surface-variant: #e7e7ee;
            --md-on-surface: #1f1f1f;
            --md-on-surface-variant: #666666;
            --md-outline: #c9c9d4;
            --md-outline-variant: #e0e0e0;
            --md-error: #b3261e;
            --md-shadow-1: 0 1px 3px rgba(0,0,0,.12);
            --md-shadow-2: 0 4px 12px rgba(0,0,0,.18);
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-full: 999px;
        }
        [data-theme="dark"] {
            --md-primary: #c3c4ff;
            --md-on-primary: #2a2a55;
            --md-primary-container: #3a3a6a;
            --md-on-primary-container: #e3e3ff;
            --md-surface: #1b1b1f;
            --md-surface-1: #232327;
            --md-surface-2: #2b2b30;
            --md-surface-variant: #2e2e34;
            --md-on-surface: #e6e6e6;
            --md-on-surface-variant: #a8a8b3;
            --md-outline: #4a4a55;
            --md-outline-variant: #35353c;
            --md-error: #f2b8b5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
            background: var(--md-surface-1); color: var(--md-on-surface); line-height: 1.5;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        /* 视图用文档流布局(非 fixed):Android WebView 键盘弹出时页面自然收缩,输入框不被遮挡 */
        .view {
            flex: 1; min-height: 0; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .view.hidden { display: none; }

        /* ===== 顶部栏 ===== */
        /* 注意:.search-bar 不能叫 .app-bar——宿主 components.css 在 embed 模式下
           会执行 html.embed .app-bar { display: none !important; },把搜索框整行藏掉 */
        .app-bar, .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; flex: 0 0 auto;
            z-index: 10;
        }
        .app-bar .app-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(127,127,157,.14); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto;
        }
        .app-bar .app-icon img { width: 20px; height: 20px; }
        .app-bar .bar-title { font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-icon {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: transparent; color: inherit;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0; flex: 0 0 auto;
        }
        .btn-icon .material-symbols-outlined { font-size: 24px; }
        .btn-filled {
            padding: 9px 16px; border: 0; border-radius: var(--md-radius-sm);
            background: var(--md-primary); color: var(--md-on-primary);
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-filled:disabled { opacity: .5; cursor: not-allowed; }
        .btn-text {
            padding: 8px 12px; border: 0; border-radius: var(--md-radius-sm);
            background: transparent; color: var(--md-primary);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .text-field {
            flex: 1; width: 100%; padding: 9px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface); min-width: 0;
        }
        .text-field:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
        .select-field {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
        }

        /* 平台多选 chips */
        .platform-bar {
            display: flex; gap: 8px; padding: 10px 14px 2px;
            flex: 0 0 auto; flex-wrap: wrap;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: var(--md-radius-full);
            border: 1px solid var(--md-outline); background: var(--md-surface);
            color: var(--md-on-surface-variant); font-size: 13px; font-weight: 500;
            cursor: pointer; user-select: none; -webkit-user-select: none;
        }
        .chip .material-symbols-outlined { font-size: 15px; }
        .chip.on { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }

        /* ===== 搜索视图 ===== */
        #searchView { background: var(--md-surface-1); }
        #searchView .search-bar { background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant); }
        .container { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
        .status { font-size: 13px; padding: 4px 2px 8px; min-height: 18px; }
        .status.ok { color: #2e7d32; } [data-theme="dark"] .status.ok { color: #81c784; }
        .status.err { color: #c62828; } [data-theme="dark"] .status.err { color: #ef9a9a; }
        .status.muted { color: var(--md-on-surface-variant); }
        .song-row {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 4px; border-bottom: 1px solid var(--md-outline-variant);
        }
        .song-row:last-child { border-bottom: none; }
        .song-cover {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            object-fit: cover; flex: 0 0 auto; background: var(--md-surface-variant);
        }
        .song-cover-ph {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            background: var(--md-surface-variant); color: var(--md-on-surface-variant);
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .song-cover-ph .material-symbols-outlined { font-size: 20px; }
        .song-meta { flex: 1; min-width: 0; }
        .song-title2 { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub2 { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 28px 0; }

        /* ===== 底部面板(队列/歌词/音量/配置) ===== */
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; }
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
            background: var(--md-surface); border-radius: 18px 18px 0 0;
            box-shadow: 0 -8px 32px rgba(0,0,0,.22);
            display: flex; flex-direction: column;
            max-height: 72vh;
            transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
        }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--md-outline); margin: 8px auto 2px; flex: 0 0 auto; }
        .sheet-title { padding: 10px 18px 8px; font-size: 15px; font-weight: 600; flex: 0 0 auto; }
        .sheet-body { padding: 0 8px 14px; overflow-y: auto; flex: 1; }

        /* 配置 */
        .dialog-body { padding: 14px 18px 4px; }
        .dialog-body label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
        .dialog-body label:first-child { margin-top: 0; }
        .dialog-hint { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
        .dialog-status { padding: 8px 18px 0; font-size: 13px; min-height: 18px; }
        .dialog-status.ok { color: #2e7d32; } [data-theme="dark"] .dialog-status.ok { color: #81c784; }
        .dialog-status.err { color: #c62828; } [data-theme="dark"] .dialog-status.err { color: #ef9a9a; }
        .sheet-footer { padding: 10px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; }

        /* 歌单选择 */
        .pl-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px; cursor: pointer;
        }
        .pl-row:hover { background: rgba(99,102,241,.07); }
        .pl-row .pl-icon {
            width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
            background: rgba(99,102,241,.14); color: var(--md-primary);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .pl-row .pl-icon .material-symbols-outlined { font-size: 20px; }
        .pl-row .pl-meta { flex: 1; min-width: 0; }
        .pl-row .pl-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-check { color: var(--md-primary); }

        /* ===== 首页浏览(平台标签 + 猜你喜欢/推荐歌单/排行榜) ===== */
        .browse-tabs { display: flex; gap: 8px; padding: 10px 14px 0; flex: 0 0 auto; }
        .browse-tab {
            padding: 7px 18px; border-radius: var(--md-radius-full);
            border: 1px solid var(--md-outline); background: var(--md-surface);
            color: var(--md-on-surface-variant); font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .browse-tab.on { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }
        .browse { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 68px; }
        .browse-module { margin-bottom: 18px; }
        .browse-module-title {
            font-size: 15px; font-weight: 700; margin: 2px 0 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .browse-module-title .material-symbols-outlined { font-size: 18px; color: var(--md-primary); }
        .browse-cards { display: flex; flex-wrap: wrap; gap: 10px; }
        .browse-card { width: calc(33.333% - 7px); min-width: 96px; cursor: pointer; }
        .browse-card .bc-cover {
            width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover;
            background: var(--md-surface-variant); display: block;
        }
        .browse-card .bc-name {
            font-size: 12px; margin-top: 5px; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .browse-card .bc-meta { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; }
        .browse-rank { display: flex; flex-direction: column; }
        /* 批量导入曲库按钮 */
        .batch-bar { padding: 4px 0 10px; }
        .batch-bar .btn-filled { width: 100%; }

        .browse-rank-row {
            display: flex; align-items: center; gap: 12px; padding: 7px 4px;
            border-bottom: 1px solid var(--md-outline-variant); cursor: pointer;
        }
        .browse-rank-row:last-child { border-bottom: none; }
        .browse-rank-idx {
            width: 26px; text-align: right; font-size: 14px; font-weight: 700;
            color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; flex: 0 0 auto;
        }
        .browse-rank-idx.top { color: var(--md-primary); }
        .browse-rank-cover { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--md-surface-variant); flex: 0 0 auto; }
        .browse-rank-meta { flex: 1; min-width: 0; }
        .browse-rank-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .browse-rank-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .browse-loading, .browse-error { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 24px 0; }
        .browse-error { color: #c62828; } [data-theme="dark"] .browse-error { color: #ef9a9a; }

        /* 歌单详情 */
        .browse-detail-back {
            display: flex; align-items: center; gap: 4px; padding: 2px 0 10px;
            font-size: 13px; font-weight: 600; color: var(--md-primary); cursor: pointer;
        }
        .browse-detail-back .material-symbols-outlined { font-size: 18px; }
        .browse-detail-head { display: flex; align-items: center; gap: 12px; padding: 0 0 12px; }
        .browse-detail-cover { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--md-surface-variant); flex: 0 0 auto; }
        .browse-detail-title { font-size: 15px; font-weight: 700; }
        .browse-detail-sub { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; }

        /* Snackbar */
        .snackbar {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px);
            background: var(--md-on-surface); color: var(--md-surface);
            padding: 10px 18px; border-radius: var(--md-radius-full);
            font-size: 13px; box-shadow: var(--md-shadow-2); z-index: 300;
            opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: 88vw;
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    </style>
    <script>
      (function () {
        function applyTheme(t) {
          const theme = (t || '').toString().toLowerCase();
          if (theme !== 'dark' && theme !== 'light') return;
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('songloft-theme', theme); } catch (e) {}
        }
        window.addEventListener('message', function (e) {
          if (e && e.data && e.data.type === 'songloft-theme') applyTheme(e.data.theme);
        });
        const existing = document.documentElement.getAttribute('data-theme');
        const saved = (function () { try { return localStorage.getItem('songloft-theme'); } catch (e) { return null; } })();
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(existing || saved || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
</head>
<body>
    <!-- ===== 搜索视图(默认打开,搜索框直达) ===== -->
    <div class="view" id="searchView">
        <header class="search-bar">
            <button class="btn-icon" id="homeBtn" title="返回首页"><span class="material-symbols-outlined">home</span></button>
            <input type="text" class="text-field" id="searchInput" placeholder="搜索歌手、歌曲…" onkeydown="if(event.key==='Enter')window.searchGo&&searchGo()">
            <button class="btn-filled" id="searchGoBtn" onclick="window.searchGo&&searchGo()">搜索</button>
            <button class="btn-icon" id="configBtn2" title="插件设置(API Key / 音质)"><span class="material-symbols-outlined">settings</span></button>
        </header>
        <div class="platform-bar" id="platformBar"></div>
        <div class="browse-tabs" id="browseTabs"></div>
        <div class="browse" id="browse"><div class="browse-loading">加载中…</div></div>
        <!-- 搜索结果容器:默认隐藏,搜索时显示(首页浏览区占满屏幕) -->
        <div class="container" id="searchContainer" style="display:none">
            <div class="status muted" id="searchStatus"></div>
            <div id="results"></div>
        </div>
    </div>

    <!-- ===== 配置弹窗(左上角图标) ===== -->
    <div class="menu-backdrop" id="configBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="configSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">插件设置</div>
        <div class="dialog-body">
            <label for="apiKey">API Key</label>
            <input type="password" class="text-field" id="apiKey" placeholder="api.chksz.com 登录后获取" autocomplete="off">
            <div class="dialog-hint" id="apiKeyHint">Key 保存在服务端,不会写入插件代码</div>
            <label for="quality">默认音质</label>
            <select class="select-field" id="quality">
                <option value="flac">无损 (FLAC)</option>
                <option value="320k">高品质 (320 kbps)</option>
                <option value="128k">标准 (128 kbps)</option>
            </select>
            <div class="dialog-hint">网易云: lossless / exhigh / standard;QQ·酷狗: flac / 320k / 128k</div>
        </div>
        <div class="dialog-status" id="configStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="configCancelBtn">取消</button>
            <button class="btn-filled" id="saveConfigBtn">保存</button>
        </div>
    </div>

    <!-- ===== 收藏到歌单面板 ===== -->
    <div class="menu-backdrop" id="playlistBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="playlistSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">收藏到歌单</div>
        <div class="sheet-body" id="playlistList"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="playlistCancelBtn">取消</button>
        </div>
    </div>

    <!-- ===== 新建歌单面板 ===== -->
    <div class="menu-backdrop" id="createBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="createSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">新建歌单</div>
        <div class="dialog-body">
            <label for="createName">歌单名称</label>
            <input type="text" class="text-field" id="createName" placeholder="输入歌单名称" maxlength="40">
        </div>
        <div class="dialog-status" id="createStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="createCancelBtn">取消</button>
            <button class="btn-filled" id="createConfirmBtn">创建并收藏</button>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
