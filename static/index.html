<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChKSz 音源设置</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      background: #f5f5f5; color: #1a1a1a; padding: 24px 16px;
      max-width: 520px; margin: 0 auto; line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #e6e6e6; }
      .card { background: #1e1e1e; border-color: #333; }
      input, select { background: #2a2a2a; color: #e6e6e6; border-color: #444; }
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { opacity: .65; font-size: 13px; margin-bottom: 20px; }
    .card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px; background: #fff;
    }
    input:focus, select:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
      background: #6366f1; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { font-size: 13px; margin-top: 10px; min-height: 20px; }
    .ok { color: #16a34a; } .err { color: #dc2626; }
    .hint { font-size: 12px; opacity: .6; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>ChKSz 音源</h1>
  <div class="sub">通过 api.chksz.com 搜索并解析网易云 / QQ音乐 / 酷狗播放链接</div>

  <div class="card">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="api.chksz.com 登录后获取的个人密钥" autocomplete="off">
    <div class="hint">Key 保存在本服务端,不会写入插件代码</div>

    <label for="quality">默认音质</label>
    <select id="quality">
      <option value="flac">flac(无损,默认)</option>
      <option value="320k">320k</option>
      <option value="128k">128k</option>
    </select>
    <div class="hint">网易云对应 level: lossless / exhigh / standard;QQ/酷狗对应 size: flac / 320k / 128k</div>

    <button id="saveBtn" onclick="save()">保存</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    (function () {
      // 动态计算插件 API 前缀,不依赖注入的 <base>
      var BASE = window.location.pathname.replace(/\/+$/, '') + '/';

      function getToken() {
        try {
          var raw = localStorage.getItem('songloft-auth');
          if (!raw) return '';
          var obj = JSON.parse(raw);
          return obj && obj.accessToken ? obj.accessToken : '';
        } catch (e) { return ''; }
      }

      function api(path, opts) {
        opts = opts || {};
        var headers = opts.headers || {};
        var token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        if (opts.body) headers['Content-Type'] = 'application/json';
        return fetch(BASE + path, {
          method: opts.method || 'GET',
          headers: headers,
          body: opts.body || undefined,
        }).then(function (r) { return r.json().catch(function () { return null; }); });
      }

      window.loadSettings = function () {
        api('api/settings').then(function (data) {
          if (!data) return;
          var el = document.getElementById('apiKey');
          var q = document.getElementById('quality');
          if (data.api_key_set) el.placeholder = '已配置(' + data.api_key_mask + '),留空则不修改';
          if (data.quality) q.value = data.quality;
          var st = document.getElementById('status');
          st.textContent = data.api_key_set ? '已配置 Key,插件可用' : '尚未配置 API Key';
          st.className = 'status ' + (data.api_key_set ? 'ok' : 'err');
        });
      };

      window.save = function () {
        var btn = document.getElementById('saveBtn');
        var st = document.getElementById('status');
        btn.disabled = true;
        st.textContent = '保存中...';
        st.className = 'status';
        var body = { quality: document.getElementById('quality').value };
        var key = document.getElementById('apiKey').value.trim();
        if (key) body.api_key = key;
        api('api/settings', { method: 'POST', body: JSON.stringify(body) }).then(function (data) {
          btn.disabled = false;
          if (data && data.ok) {
            st.textContent = '保存成功 ✓';
            st.className = 'status ok';
            document.getElementById('apiKey').value = '';
            loadSettings();
          } else {
            st.textContent = '保存失败:' + JSON.stringify(data);
            st.className = 'status err';
          }
        }).catch(function (e) {
          btn.disabled = false;
          st.textContent = '保存失败:' + e.message;
          st.className = 'status err';
        });
      };

      document.addEventListener('DOMContentLoaded', loadSettings);
    })();
  </script>
</body>
</html>
