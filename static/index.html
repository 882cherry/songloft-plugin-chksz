<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChKSz 音源</title>
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* 主题变量(对齐主程序 Material 配色,参考 go-music-dl 插件) */
        :root {
            --md-primary: #5b5fc7;
            --md-on-primary: #ffffff;
            --md-primary-container: #e0e0fb;
            --md-on-primary-container: #1a1b3d;
            --md-surface: #ffffff;
            --md-surface-1: #f7f7fb;
            --md-surface-2: #efeff4;
            --md-surface-variant: #e7e7ee;
            --md-on-surface: #1f1f1f;
            --md-on-surface-variant: #666666;
            --md-outline: #c9c9d4;
            --md-outline-variant: #e0e0e0;
            --md-error: #b3261e;
            --md-shadow-1: 0 1px 3px rgba(0,0,0,.12);
            --md-shadow-2: 0 4px 12px rgba(0,0,0,.18);
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-xl: 999px;
            --md-radius-full: 999px;
        }
        [data-theme="dark"] {
            --md-primary: #c3c4ff;
            --md-on-primary: #2a2a55;
            --md-primary-container: #3a3a6a;
            --md-on-primary-container: #e3e3ff;
            --md-surface: #1b1b1f;
            --md-surface-1: #232327;
            --md-surface-2: #2b2b30;
            --md-surface-variant: #2e2e34;
            --md-on-surface: #e6e6e6;
            --md-on-surface-variant: #a8a8b3;
            --md-outline: #4a4a55;
            --md-outline-variant: #35353c;
            --md-error: #f2b8b5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: var(--md-surface-1); color: var(--md-on-surface); font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; line-height: 1.5; }

        /* 顶部栏:左侧插件图标(点击打开配置) */
        .app-bar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant);
        }
        .app-bar .app-icon {
            width: 34px; height: 34px; border-radius: 50%;
            border: none; background: var(--md-surface-2); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; padding: 0;
            flex: 0 0 auto;
        }
        .app-bar .app-icon:hover { background: rgba(99,102,241,.12); }
        .app-bar .app-icon img { width: 22px; height: 22px; }
        .app-bar .bar-title { font-size: 17px; font-weight: 600; }
        .app-bar .bar-sub { font-size: 12px; color: var(--md-on-surface-variant); }

        .container { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }

        .card {
            background: var(--md-surface); border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-radius-md); padding: 14px; margin-bottom: 12px;
        }
        .search-row { display: flex; gap: 8px; align-items: center; }
        .text-field {
            flex: 1; width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
        }
        .text-field:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
        .select-field {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
        }
        .btn-filled {
            padding: 10px 18px; border: 0; border-radius: var(--md-radius-sm);
            background: var(--md-primary); color: var(--md-on-primary);
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-filled:disabled { opacity: .5; cursor: not-allowed; }
        .btn-text {
            padding: 8px 12px; border: 0; border-radius: var(--md-radius-sm);
            background: transparent; color: var(--md-primary);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .btn-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: transparent; color: var(--md-on-surface-variant);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0;
        }
        .btn-icon:hover { background: rgba(99,102,241,.10); color: var(--md-primary); }

        /* 搜索结果行 */
        .song-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 4px; border-bottom: 1px solid var(--md-outline-variant);
        }
        .song-row:last-child { border-bottom: none; }
        .song-cover {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            object-fit: cover; flex: 0 0 auto; background: var(--md-surface-variant);
        }
        .song-cover-placeholder {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            background: var(--md-surface-variant); color: var(--md-on-surface-variant);
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .song-meta { flex: 1; min-width: 0; }
        .song-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub { font-size: 12px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-tags { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
        .song-status {
            display: inline-block; font-size: 11px; padding: 1px 8px;
            border-radius: var(--md-radius-xl); line-height: 1.6; font-weight: 600;
            background: rgba(99,102,241,.12); color: var(--md-primary);
        }
        .song-actions { display: flex; gap: 4px; flex: 0 0 auto; }

        /* 状态提示 */
        .status { font-size: 13px; padding: 8px 4px 0; min-height: 20px; }
        .status.ok { color: #2e7d32; } [data-theme="dark"] .status.ok { color: #81c784; }
        .status.err { color: #c62828; } [data-theme="dark"] .status.err { color: #ef9a9a; }
        .status.muted { color: var(--md-on-surface-variant); }
        .empty-state { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 24px 0; }

        /* 配置弹窗 */
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; }
        .dialog-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 201; width: min(360px, 88vw);
            background: var(--md-surface); border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .dialog-title { padding: 16px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--md-outline-variant); }
        .dialog-body { padding: 16px; }
        .dialog-body label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
        .dialog-body label:first-child { margin-top: 0; }
        .dialog-hint { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
        .dialog-footer { padding: 12px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--md-outline-variant); }
        .dialog-status { padding: 0 16px 12px; font-size: 13px; min-height: 18px; }

        /* Snackbar */
        .snackbar {
            position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
            background: var(--md-on-surface); color: var(--md-surface);
            padding: 10px 18px; border-radius: var(--md-radius-full);
            font-size: 13px; box-shadow: var(--md-shadow-2); z-index: 300;
            opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: 88vw;
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <script>
      /* 主题联动:响应宿主 postMessage('songloft-theme') 与 data-theme,实现深浅色同步 */
      (function () {
        function applyTheme(t) {
          const theme = (t || '').toString().toLowerCase();
          if (theme !== 'dark' && theme !== 'light') return;
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('songloft-theme', theme); } catch (e) {}
        }
        window.addEventListener('message', function (e) {
          if (e && e.data && e.data.type === 'songloft-theme') applyTheme(e.data.theme);
        });
        const existing = document.documentElement.getAttribute('data-theme');
        const saved = (function () { try { return localStorage.getItem('songloft-theme'); } catch (e) { return null; } })();
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(existing || saved || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
</head>
<body>
    <header class="app-bar">
        <button class="app-icon" id="configBtn" title="插件设置(API Key / 音质)">
            <img src="static/icon.svg" alt="ChKSz">
        </button>
        <div>
            <div class="bar-title">ChKSz 音源</div>
            <div class="bar-sub">网易云 / QQ / 酷狗 搜索播放</div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="search-row">
                <input type="text" class="text-field" id="searchInput" placeholder="搜索歌手、歌曲… 如: 周杰伦 晴天" onkeydown="if(event.key==='Enter')search()">
                <button class="btn-filled" id="searchBtn" onclick="search()">搜索</button>
            </div>
            <div class="status muted" id="searchStatus"></div>
        </div>
        <div class="card" id="listCard">
            <div id="results"><div class="empty-state">输入关键词搜索,点击结果播放或加入队列</div></div>
        </div>
    </div>

    <!-- 配置弹窗(左上角图标打开) -->
    <div id="configBackdrop" class="menu-backdrop" style="display:none" onclick="closeConfig()"></div>
    <div id="configDialog" class="dialog-panel" style="display:none">
        <div class="dialog-title">插件设置</div>
        <div class="dialog-body">
            <label for="apiKey">API Key</label>
            <input type="password" class="text-field" id="apiKey" placeholder="api.chksz.com 登录后获取" autocomplete="off">
            <div class="dialog-hint" id="apiKeyHint">Key 保存在服务端,不会写入插件代码</div>
            <label for="quality">默认音质</label>
            <select class="select-field" id="quality">
                <option value="flac">无损 (FLAC)</option>
                <option value="320k">高品质 (320 kbps)</option>
                <option value="128k">标准 (128 kbps)</option>
            </select>
            <div class="dialog-hint">网易云: lossless / exhigh / standard;QQ·酷狗: flac / 320k / 128k</div>
        </div>
        <div class="dialog-status" id="configStatus"></div>
        <div class="dialog-footer">
            <button class="btn-text" onclick="closeConfig()">取消</button>
            <button class="btn-filled" id="saveConfigBtn" onclick="saveConfig()">保存</button>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>

    <script>
      (function () {
        var BASE = window.location.pathname.replace(/\/+$/, '') + '/';
        var PLATFORM_NAME = { wy: '网易云', tx: 'QQ', kg: '酷狗' };
        var snackbarTimer = null;

        function getToken() {
          try {
            var raw = localStorage.getItem('songloft-auth');
            if (!raw) return '';
            var obj = JSON.parse(raw);
            return obj && obj.accessToken ? obj.accessToken : '';
          } catch (e) { return ''; }
        }

        function api(path, opts) {
          opts = opts || {};
          var headers = opts.headers || {};
          var token = getToken();
          if (token) headers['Authorization'] = 'Bearer ' + token;
          if (opts.body) headers['Content-Type'] = 'application/json';
          return fetch(BASE + path, {
            method: opts.method || 'GET',
            headers: headers,
            body: opts.body || undefined,
          }).then(function (r) { return r.json().catch(function () { return null; }); });
        }

        function snackbar(msg) {
          var el = document.getElementById('snackbar');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(snackbarTimer);
          snackbarTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
        }

        function setStatus(el, msg, kind) {
          el.textContent = msg;
          el.className = 'status ' + (kind || 'muted');
        }

        // ===== 配置(左上角图标) =====
        window.openConfig = function () {
          document.getElementById('configBackdrop').style.display = 'block';
          document.getElementById('configDialog').style.display = 'flex';
          document.getElementById('configStatus').textContent = '';
          api('api/settings').then(function (data) {
            if (!data) return;
            var keyEl = document.getElementById('apiKey');
            var qEl = document.getElementById('quality');
            if (data.api_key_set) {
              keyEl.placeholder = '已配置(' + data.api_key_mask + '),留空不修改';
              document.getElementById('apiKeyHint').textContent = '已配置,留空保存则不修改';
            }
            if (data.quality) qEl.value = data.quality;
          });
        };
        window.closeConfig = function () {
          document.getElementById('configBackdrop').style.display = 'none';
          document.getElementById('configDialog').style.display = 'none';
          loadSettingsSilent();
        };
        window.saveConfig = function () {
          var btn = document.getElementById('saveConfigBtn');
          var st = document.getElementById('configStatus');
          btn.disabled = true;
          st.textContent = '保存中…';
          var body = { quality: document.getElementById('quality').value };
          var key = document.getElementById('apiKey').value.trim();
          if (key) body.api_key = key;
          api('api/settings', { method: 'POST', body: JSON.stringify(body) }).then(function (data) {
            btn.disabled = false;
            if (data && data.ok) {
              st.textContent = '已保存 ✓';
              st.className = 'dialog-status';
              snackbar('配置已保存');
              setTimeout(closeConfig, 700);
            } else {
              st.textContent = '保存失败:' + JSON.stringify(data) + '(若为 401,请重新打开插件页)';
            }
          }).catch(function (e) {
            btn.disabled = false;
            st.textContent = '保存失败:' + e.message;
          });
        };

        // 静默检查 Key 是否已配置(不影响页面)
        function loadSettingsSilent() {
          api('api/settings').then(function (data) {
            if (!data) return;
            var st = document.getElementById('searchStatus');
            if (data.api_key_set) setStatus(st, '已配置 Key,可搜索', 'ok');
            else setStatus(st, '点击左上角图标配置 API Key', 'err');
          });
        }

        // ===== 搜索 =====
        window.search = function () {
          var kw = document.getElementById('searchInput').value.trim();
          var st = document.getElementById('searchStatus');
          var btn = document.getElementById('searchBtn');
          if (!kw) { setStatus(st, '请输入关键词', 'err'); return; }
          btn.disabled = true;
          setStatus(st, '搜索中…');
          api('api/search', { method: 'POST', body: JSON.stringify({ keyword: kw }) }).then(function (data) {
            btn.disabled = false;
            var results = (data && data.results) || [];
            if (!results.length) {
              setStatus(st, '未找到结果(检查 API Key 是否有效)', 'err');
              renderResults([]);
              return;
            }
            setStatus(st, '找到 ' + results.length + ' 首,点击播放或加入队列', 'ok');
            renderResults(results);
          }).catch(function (e) {
            btn.disabled = false;
            setStatus(st, '搜索失败:' + e.message, 'err');
          });
        };

        function renderResults(results) {
          var box = document.getElementById('results');
          box.innerHTML = '';
          if (!results.length) {
            box.innerHTML = '<div class="empty-state">未找到结果</div>';
            return;
          }
          var hasPlayer = !!(window.SongloftPlugin && window.SongloftPlugin.player);
          results.forEach(function (item) {
            var platform = item.source_data ? item.source_data.platform : '';
            var pname = PLATFORM_NAME[platform] || platform || '未知';
            var row = document.createElement('div');
            row.className = 'song-row';
            var cover = item.cover_url
              ? '<img class="song-cover" src="' + item.cover_url + '" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=&quot;song-cover-placeholder&quot;><span class=&quot;material-symbols-outlined&quot;>music_note</span></span>\'">'
              : '<span class="song-cover-placeholder"><span class="material-symbols-outlined" style="font-size:20px">music_note</span></span>';
            row.innerHTML =
              cover +
              '<div class="song-meta">' +
              '  <div class="song-title"></div>' +
              '  <div class="song-tags"><span class="song-status">' + pname + '</span><span class="song-sub"></span></div>' +
              '</div>' +
              '<div class="song-actions">' +
              (hasPlayer
                ? '<button class="btn-icon" title="播放"><span class="material-symbols-outlined">play_arrow</span></button>' +
                  '<button class="btn-icon" title="加入队列"><span class="material-symbols-outlined">playlist_add</span></button>' +
                  '<button class="btn-icon" title="导入曲库"><span class="material-symbols-outlined">library_add</span></button>'
                : '<button class="btn-icon" title="导入曲库"><span class="material-symbols-outlined">library_add</span></button>') +
              '</div>';
            row.querySelector('.song-title').textContent = item.title;
            row.querySelector('.song-sub').textContent = [item.artist, item.album].filter(Boolean).join(' · ');
            var btns = row.querySelectorAll('.song-actions .btn-icon');
            btns[0].onclick = function () { handleResult(item, btns.length > 1 ? 'play' : 'import'); };
            if (btns.length > 1) {
              btns[1].onclick = function () { handleResult(item, 'queue'); };
              btns[2].onclick = function () { handleResult(item, 'import'); };
            }
            box.appendChild(row);
          });
        }

        function handleResult(item, action) {
          var st = document.getElementById('searchStatus');
          setStatus(st, '处理中…');
          api('api/import', { method: 'POST', body: JSON.stringify({ song: item }) }).then(function (data) {
            if (!data || !data.ok || !data.id) {
              setStatus(st, '导入失败:' + JSON.stringify(data), 'err');
              return;
            }
            var player = window.SongloftPlugin && window.SongloftPlugin.player;
            if (action === 'play' && player) {
              player.setQueue([data.id], { startIndex: 0 });
              setStatus(st, '开始播放:' + data.title, 'ok');
            } else if (action === 'queue' && player) {
              player.addToQueue([data.id]);
              setStatus(st, '已加入播放队列:' + data.title, 'ok');
            } else {
              setStatus(st, '已导入曲库:' + data.title, 'ok');
              snackbar('已导入曲库');
            }
          }).catch(function (e) {
            setStatus(st, '导入失败:' + e.message, 'err');
          });
        }

        document.getElementById('configBtn').addEventListener('click', openConfig);
        loadSettingsSilent();
      })();
    </script>
</body>
</html>
