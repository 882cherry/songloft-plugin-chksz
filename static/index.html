<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChKSz 音源</title>
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --md-primary: #5b5fc7;
            --md-on-primary: #ffffff;
            --md-primary-container: #e0e0fb;
            --md-on-primary-container: #1a1b3d;
            --md-surface: #ffffff;
            --md-surface-1: #f7f7fb;
            --md-surface-2: #efeff4;
            --md-surface-variant: #e7e7ee;
            --md-on-surface: #1f1f1f;
            --md-on-surface-variant: #666666;
            --md-outline: #c9c9d4;
            --md-outline-variant: #e0e0e0;
            --md-error: #b3261e;
            --md-shadow-1: 0 1px 3px rgba(0,0,0,.12);
            --md-shadow-2: 0 4px 12px rgba(0,0,0,.18);
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-full: 999px;
        }
        [data-theme="dark"] {
            --md-primary: #c3c4ff;
            --md-on-primary: #2a2a55;
            --md-primary-container: #3a3a6a;
            --md-on-primary-container: #e3e3ff;
            --md-surface: #1b1b1f;
            --md-surface-1: #232327;
            --md-surface-2: #2b2b30;
            --md-surface-variant: #2e2e34;
            --md-on-surface: #e6e6e6;
            --md-on-surface-variant: #a8a8b3;
            --md-outline: #4a4a55;
            --md-outline-variant: #35353c;
            --md-error: #f2b8b5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
            background: var(--md-surface-1); color: var(--md-on-surface); line-height: 1.5;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        /* 视图用文档流布局(非 fixed):Android WebView 键盘弹出时页面自然收缩,输入框不被遮挡 */
        .view {
            flex: 1; min-height: 0; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .view.hidden { display: none; }

        /* ===== 顶部栏 ===== */
        /* 注意:.search-bar 不能叫 .app-bar——宿主 components.css 在 embed 模式下
           会执行 html.embed .app-bar { display: none !important; },把搜索框整行藏掉 */
        .app-bar, .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; flex: 0 0 auto;
            z-index: 10;
        }
        .app-bar .app-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(127,127,157,.14); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto;
        }
        .app-bar .app-icon img { width: 20px; height: 20px; }
        .app-bar .bar-title { font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-icon {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: transparent; color: inherit;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0; flex: 0 0 auto;
        }
        .btn-icon .material-symbols-outlined { font-size: 24px; }
        .btn-filled {
            padding: 9px 16px; border: 0; border-radius: var(--md-radius-sm);
            background: var(--md-primary); color: var(--md-on-primary);
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-filled:disabled { opacity: .5; cursor: not-allowed; }
        .btn-text {
            padding: 8px 12px; border: 0; border-radius: var(--md-radius-sm);
            background: transparent; color: var(--md-primary);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .text-field {
            flex: 1; width: 100%; padding: 9px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface); min-width: 0;
        }
        .text-field:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
        .select-field {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm);
            background: var(--md-surface); color: var(--md-on-surface);
        }

        /* 平台多选 chips */
        .platform-bar {
            display: flex; gap: 8px; padding: 10px 14px 2px;
            flex: 0 0 auto; flex-wrap: wrap;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: var(--md-radius-full);
            border: 1px solid var(--md-outline); background: var(--md-surface);
            color: var(--md-on-surface-variant); font-size: 13px; font-weight: 500;
            cursor: pointer; user-select: none; -webkit-user-select: none;
        }
        .chip .material-symbols-outlined { font-size: 15px; }
        .chip.on { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }

        /* 播放器视图 */
        #playerView { background: var(--md-surface); }
        .bg-blur {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-size: cover; background-position: center; filter: blur(60px) saturate(1.3);
            opacity: .55; transform: scale(1.2);
        }
        .bg-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.02) 30%, rgba(0,0,0,.25)); }
        #playerView .app-bar { position: relative; color: var(--md-on-surface); }

        /* 双页滑动容器(播放 ⇄ 歌词) */
        .player-swiper {
            position: relative; z-index: 2; flex: 1; min-height: 0;
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .player-swiper::-webkit-scrollbar { display: none; }
        .swiper-page {
            flex: 0 0 100%; width: 100%; scroll-snap-align: start;
            overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch;
        }
        .page-indicator {
            position: relative; z-index: 3; display: flex; justify-content: center; gap: 6px;
            padding: 6px 0 2px; flex: 0 0 auto;
        }
        .page-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--md-outline); transition: all .2s ease; }
        .page-dot.active { width: 18px; border-radius: 3px; background: var(--md-primary); }

        .player-page {
            display: flex; flex-direction: column; align-items: center;
            padding: 6px 24px 18px; min-height: 100%;
        }
        .cover-wrap {
            width: min(58vw, 280px); aspect-ratio: 1; flex: 0 0 auto;
            border-radius: 18px; overflow: hidden; position: relative;
            box-shadow: 0 18px 40px rgba(0,0,0,.28);
            background: var(--md-surface-variant); margin: 6px 0 14px;
        }
        .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover-ph {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: var(--md-on-surface-variant);
        }
        .cover-ph .material-symbols-outlined { font-size: 72px; }
        .song-info { text-align: center; width: 100%; margin-bottom: 8px; }
        .song-title { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 13px; color: var(--md-on-surface-variant); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-tags { display: flex; justify-content: center; gap: 6px; margin-top: 6px; min-height: 18px; }
        .song-status {
            font-size: 11px; padding: 1px 9px; border-radius: var(--md-radius-full);
            line-height: 1.6; font-weight: 600; background: rgba(99,102,241,.14); color: var(--md-primary);
        }

        /* 进度条 */
        .progress { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 2px; }
        .progress-time { font-size: 12px; color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
        .progress-track {
            position: relative; flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer;
        }
        .progress-rail { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--md-surface-variant); }
        .progress-fill { position: absolute; left: 0; height: 4px; border-radius: 2px; background: var(--md-primary); width: 0%; }
        .progress-thumb {
            position: absolute; width: 14px; height: 14px; border-radius: 50%;
            background: var(--md-primary); border: 2px solid var(--md-surface);
            transform: translateX(-50%); left: 0%; display: none;
            box-shadow: var(--md-shadow-1);
        }
        .progress-track.dragging .progress-thumb { display: block; }

        /* 控制区 */
        .controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 340px; margin: 4px 0 2px; }
        .controls .btn-icon { width: 44px; height: 44px; }
        .controls .btn-icon .material-symbols-outlined { font-size: 28px; }
        .play-btn {
            width: 62px !important; height: 62px !important;
            background: var(--md-primary) !important; color: var(--md-on-primary) !important;
            box-shadow: 0 8px 22px rgba(99,102,241,.38);
        }
        .play-btn .material-symbols-outlined { font-size: 34px !important; }
        .player-extra { display: flex; gap: 6px; margin-top: 6px; }

        /* 歌词页 */
        .lyric-page { position: relative; display: flex; flex-direction: column; align-items: center; }
        .lyric-wrap {
            width: 100%; max-width: 480px; padding: 34px 20px 60px;
            text-align: center; font-size: 15px;
        }
        .lyric-line {
            color: var(--md-on-surface-variant); padding: 8px 6px;
            transition: color .2s ease, transform .2s ease; line-height: 1.55;
        }
        .lyric-line.active { color: var(--md-primary); font-weight: 700; font-size: 17px; transform: scale(1.02); }
        .lyric-empty { text-align: center; color: var(--md-on-surface-variant); padding: 60px 0; font-size: 13px; }

        /* ===== 搜索视图 ===== */
        #searchView { background: var(--md-surface-1); }
        #searchView .search-bar { background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant); }
        .container { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
        .status { font-size: 13px; padding: 4px 2px 8px; min-height: 18px; }
        .status.ok { color: #2e7d32; } [data-theme="dark"] .status.ok { color: #81c784; }
        .status.err { color: #c62828; } [data-theme="dark"] .status.err { color: #ef9a9a; }
        .status.muted { color: var(--md-on-surface-variant); }
        .song-row {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 4px; border-bottom: 1px solid var(--md-outline-variant);
        }
        .song-row:last-child { border-bottom: none; }
        .song-cover {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            object-fit: cover; flex: 0 0 auto; background: var(--md-surface-variant);
        }
        .song-cover-ph {
            width: 44px; height: 44px; border-radius: var(--md-radius-sm);
            background: var(--md-surface-variant); color: var(--md-on-surface-variant);
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .song-cover-ph .material-symbols-outlined { font-size: 20px; }
        .song-meta { flex: 1; min-width: 0; }
        .song-title2 { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub2 { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { text-align: center; color: var(--md-on-surface-variant); font-size: 13px; padding: 28px 0; }

        /* ===== 底部面板(队列/歌词/音量/配置) ===== */
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; }
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
            background: var(--md-surface); border-radius: 18px 18px 0 0;
            box-shadow: 0 -8px 32px rgba(0,0,0,.22);
            display: flex; flex-direction: column;
            max-height: 72vh;
            transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
        }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--md-outline); margin: 8px auto 2px; flex: 0 0 auto; }
        .sheet-title { padding: 10px 18px 8px; font-size: 15px; font-weight: 600; flex: 0 0 auto; }
        .sheet-body { padding: 0 8px 14px; overflow-y: auto; flex: 1; }

        /* 队列行 */
        .queue-row {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 10px; border-radius: 10px; cursor: pointer;
        }
        .queue-row:hover { background: rgba(99,102,241,.07); }
        .queue-row.current { background: rgba(99,102,241,.12); }
        .queue-row .q-idx { width: 22px; text-align: right; font-size: 12px; color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
        .queue-row .q-meta { flex: 1; min-width: 0; }
        .queue-row .q-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-row .q-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-row.current .q-title { color: var(--md-primary); }
        .queue-row .q-del { color: var(--md-on-surface-variant); }

        /* 歌词 */
        .lyric-line { text-align: center; font-size: 15px; color: var(--md-on-surface-variant); padding: 7px 14px; transition: color .2s ease, transform .2s ease; }
        .lyric-line.active { color: var(--md-primary); font-weight: 700; font-size: 17px; }
        .lyric-empty { text-align: center; color: var(--md-on-surface-variant); padding: 40px 0; font-size: 13px; }

        /* 音量 */
        .volume-wrap { display: flex; align-items: center; gap: 12px; padding: 6px 18px 18px; }
        .volume-wrap .material-symbols-outlined { color: var(--md-on-surface-variant); }
        input[type="range"] { flex: 1; accent-color: var(--md-primary); height: 28px; }

        /* 配置 */
        .dialog-body { padding: 14px 18px 4px; }
        .dialog-body label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
        .dialog-body label:first-child { margin-top: 0; }
        .dialog-hint { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
        .dialog-status { padding: 8px 18px 0; font-size: 13px; min-height: 18px; }
        .dialog-status.ok { color: #2e7d32; } [data-theme="dark"] .dialog-status.ok { color: #81c784; }
        .dialog-status.err { color: #c62828; } [data-theme="dark"] .dialog-status.err { color: #ef9a9a; }
        .sheet-footer { padding: 10px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; }

        /* ===== 迷你播放条(网易云风格,有当前歌曲时显示) ===== */
        .mini-player {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; background: var(--md-surface);
            border-top: 1px solid var(--md-outline-variant);
            box-shadow: 0 -2px 12px rgba(0,0,0,.08);
            cursor: pointer;
        }
        .mini-cover {
            width: 40px; height: 40px; border-radius: var(--md-radius-sm); flex: 0 0 auto;
            background: var(--md-surface-variant); overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--md-on-surface-variant);
        }
        .mini-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .mini-cover .material-symbols-outlined { font-size: 20px; }
        .mini-meta { flex: 1; min-width: 0; }
        .mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-btn { width: 36px; height: 36px; }
        /* 搜索结果容器底部留出迷你播放条空间 */
        #searchView .container { padding-bottom: 68px; }

        /* ===== 全屏播放界面(覆盖层,可折叠收起) ===== */
        .player-overlay {
            position: fixed; inset: 0; z-index: 150;
            background: var(--md-surface-1); color: var(--md-on-surface);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .player-topbar {
            position: relative; z-index: 3; display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; flex: 0 0 auto;
        }
        .player-top-title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-top-spacer { width: 40px; flex: 0 0 auto; }
        .player-body { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .lyric-back {
            display: flex; align-items: center; gap: 4px; padding: 10px 14px;
            font-size: 13px; font-weight: 600; color: var(--md-primary);
            cursor: pointer; flex: 0 0 auto; align-self: flex-start;
        }
        .lyric-back .material-symbols-outlined { font-size: 18px; }

        /* 歌单选择 */
        .pl-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px; cursor: pointer;
        }
        .pl-row:hover { background: rgba(99,102,241,.07); }
        .pl-row .pl-icon {
            width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
            background: rgba(99,102,241,.14); color: var(--md-primary);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .pl-row .pl-icon .material-symbols-outlined { font-size: 20px; }
        .pl-row .pl-meta { flex: 1; min-width: 0; }
        .pl-row .pl-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-sub { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-row .pl-check { color: var(--md-primary); }

        /* Snackbar */
        .snackbar {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px);
            background: var(--md-on-surface); color: var(--md-surface);
            padding: 10px 18px; border-radius: var(--md-radius-full);
            font-size: 13px; box-shadow: var(--md-shadow-2); z-index: 300;
            opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: 88vw;
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <script>
      (function () {
        function applyTheme(t) {
          const theme = (t || '').toString().toLowerCase();
          if (theme !== 'dark' && theme !== 'light') return;
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('songloft-theme', theme); } catch (e) {}
        }
        window.addEventListener('message', function (e) {
          if (e && e.data && e.data.type === 'songloft-theme') applyTheme(e.data.theme);
        });
        const existing = document.documentElement.getAttribute('data-theme');
        const saved = (function () { try { return localStorage.getItem('songloft-theme'); } catch (e) { return null; } })();
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(existing || saved || (prefersDark ? 'dark' : 'light'));
      })();
    </script>
</head>
<body>
    <!-- ===== 迷你播放条(有当前歌曲时显示,点击展开全屏播放界面) ===== -->
    <div class="mini-player" id="miniPlayer" style="display:none">
        <div class="mini-cover">
            <img id="miniCover" alt="" referrerpolicy="no-referrer" style="display:none">
            <span class="material-symbols-outlined" id="miniCoverPh">music_note</span>
        </div>
        <div class="mini-meta">
            <div class="mini-title" id="miniTitle">未在播放</div>
            <div class="mini-sub" id="miniSub"></div>
        </div>
        <button class="btn-icon mini-btn" id="miniPlayBtn" title="播放/暂停"><span class="material-symbols-outlined">play_arrow</span></button>
        <button class="btn-icon mini-btn" id="miniNextBtn" title="下一首"><span class="material-symbols-outlined">skip_next</span></button>
    </div>

    <!-- ===== 全屏播放界面(覆盖层,可折叠收起回到搜索页) ===== -->
    <div class="player-overlay" id="playerScreen" style="display:none">
        <div class="bg-blur" id="bgBlur"></div>
        <div class="bg-overlay"></div>
        <div class="player-topbar">
            <button class="btn-icon" id="collapsePlayerBtn" title="收起播放界面"><span class="material-symbols-outlined">keyboard_arrow_down</span></button>
            <div class="player-top-title" id="playerTopTitle">正在播放</div>
            <div class="player-top-spacer"></div>
        </div>
        <div class="player-body">
            <!-- 页 1:播放(点击封面/歌曲信息可切到歌词) -->
            <div class="player-page" id="playerPage">
                <div class="cover-wrap" id="coverWrap">
                    <img id="cover" alt="" referrerpolicy="no-referrer" style="display:none">
                    <div class="cover-ph" id="coverPh"><span class="material-symbols-outlined">music_note</span></div>
                </div>
                <div class="song-info">
                    <div class="song-title" id="songTitle">未在播放</div>
                    <div class="song-artist" id="songArtist"></div>
                    <div class="song-tags">
                        <span class="song-status" id="platformTag" style="display:none"></span>
                    </div>
                </div>
                <div class="progress">
                    <span class="progress-time" id="curTime">0:00</span>
                    <div class="progress-track" id="progressTrack">
                        <div class="progress-rail"></div>
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                    <span class="progress-time" id="totalTime">0:00</span>
                </div>
                <div class="controls">
                    <button class="btn-icon" id="modeBtn" title="播放模式"><span class="material-symbols-outlined">repeat</span></button>
                    <button class="btn-icon" id="prevBtn" title="上一首"><span class="material-symbols-outlined">skip_previous</span></button>
                    <button class="btn-icon play-btn" id="playBtn" title="播放/暂停"><span class="material-symbols-outlined">play_arrow</span></button>
                    <button class="btn-icon" id="nextBtn" title="下一首"><span class="material-symbols-outlined">skip_next</span></button>
                    <button class="btn-icon" id="volumeBtn" title="音量"><span class="material-symbols-outlined">volume_up</span></button>
                </div>
                <div class="player-extra">
                    <button class="btn-text" id="favBtn"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">favorite_border</span> 收藏</button>
                    <button class="btn-text" id="queueBtn"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">queue_music</span> 队列</button>
                    <button class="btn-text" id="lyricToggleBtn"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">lyrics</span> 歌词</button>
                </div>
            </div>
            <!-- 页 2:歌词(点击页面空白处/返回按钮切回播放) -->
            <div class="lyric-page" id="lyricPage" style="display:none">
                <div class="lyric-back" id="lyricBackBtn"><span class="material-symbols-outlined">arrow_back</span> 返回播放</div>
                <div class="lyric-wrap" id="lyricList"><div class="lyric-empty">暂无歌词</div></div>
            </div>
        </div>
    </div>

    <!-- ===== 搜索视图(默认打开,搜索框直达) ===== -->
    <div class="view" id="searchView">
        <header class="search-bar">
            <input type="text" class="text-field" id="searchInput" placeholder="搜索歌手、歌曲…" onkeydown="if(event.key==='Enter')window.searchGo&&searchGo()">
            <button class="btn-filled" id="searchGoBtn" onclick="window.searchGo&&searchGo()">搜索</button>
            <button class="btn-icon" id="configBtn2" title="插件设置(API Key / 音质)"><span class="material-symbols-outlined">settings</span></button>
        </header>
        <div class="platform-bar" id="platformBar"></div>
        <div class="container">
            <div class="status muted" id="searchStatus"></div>
            <div id="results"><div class="empty-state">选择平台(可多选),输入关键词开始搜索</div></div>
        </div>
    </div>

    <!-- ===== 配置弹窗(左上角图标) ===== -->
    <div class="menu-backdrop" id="configBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="configSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">插件设置</div>
        <div class="dialog-body">
            <label for="apiKey">API Key</label>
            <input type="password" class="text-field" id="apiKey" placeholder="api.chksz.com 登录后获取" autocomplete="off">
            <div class="dialog-hint" id="apiKeyHint">Key 保存在服务端,不会写入插件代码</div>
            <label for="quality">默认音质</label>
            <select class="select-field" id="quality">
                <option value="flac">无损 (FLAC)</option>
                <option value="320k">高品质 (320 kbps)</option>
                <option value="128k">标准 (128 kbps)</option>
            </select>
            <div class="dialog-hint">网易云: lossless / exhigh / standard;QQ·酷狗: flac / 320k / 128k</div>
        </div>
        <div class="dialog-status" id="configStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="configCancelBtn">取消</button>
            <button class="btn-filled" id="saveConfigBtn">保存</button>
        </div>
    </div>

    <!-- ===== 队列面板 ===== -->
    <div class="menu-backdrop" id="queueBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="queueSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">播放队列</div>
        <div class="sheet-body" id="queueList"></div>
    </div>

    <!-- ===== 音量面板 ===== -->
    <div class="menu-backdrop" id="volumeBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="volumeSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">音量</div>
        <div class="volume-wrap">
            <span class="material-symbols-outlined">volume_down</span>
            <input type="range" id="volumeSlider" min="0" max="100" step="1" value="70">
            <span class="material-symbols-outlined">volume_up</span>
        </div>
    </div>

    <!-- ===== 收藏到歌单面板 ===== -->
    <div class="menu-backdrop" id="playlistBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="playlistSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">收藏到歌单</div>
        <div class="sheet-body" id="playlistList"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="playlistCancelBtn">取消</button>
        </div>
    </div>

    <!-- ===== 新建歌单面板 ===== -->
    <div class="menu-backdrop" id="createBackdrop" style="display:none"></div>
    <div class="bottom-sheet" id="createSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">新建歌单</div>
        <div class="dialog-body">
            <label for="createName">歌单名称</label>
            <input type="text" class="text-field" id="createName" placeholder="输入歌单名称" maxlength="40">
        </div>
        <div class="dialog-status" id="createStatus"></div>
        <div class="sheet-footer">
            <button class="btn-text" id="createCancelBtn">取消</button>
            <button class="btn-filled" id="createConfirmBtn">创建并收藏</button>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
