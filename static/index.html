<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChKSz 音源</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      background: #f5f5f5; color: #1a1a1a; padding: 20px 14px 40px;
      max-width: 560px; margin: 0 auto; line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #e6e6e6; }
      .card { background: #1e1e1e; border-color: #333; }
      input, select { background: #2a2a2a; color: #e6e6e6; border-color: #444; }
      .item { background: #262626; border-color: #383838; }
      .tag { background: #333; }
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { opacity: .65; font-size: 13px; margin-bottom: 16px; }
    .card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px; background: #fff;
    }
    input:focus, select:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      padding: 10px 14px; border: 0; border-radius: 8px;
      background: #6366f1; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; color: #6366f1; border: 1px solid #6366f1; padding: 6px 10px; font-size: 13px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; }
    .status { font-size: 13px; margin-top: 10px; min-height: 20px; }
    .ok { color: #16a34a; } .err { color: #dc2626; } .muted { color: #888; }
    .hint { font-size: 12px; opacity: .6; margin-top: 6px; }
    #results { margin-top: 10px; }
    .item {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px solid #eee; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .item .meta { flex: 1; min-width: 0; }
    .item .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .a { font-size: 12px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .btns { display: flex; gap: 6px; flex-shrink: 0; }
    .tag {
      font-size: 11px; background: #eee; border-radius: 6px;
      padding: 2px 7px; flex-shrink: 0; align-self: flex-start;
    }
    .tag.wy { color: #c20c0c; } .tag.tx { color: #31c27c; } .tag.kg { color: #2ca3f8; }
    .loading { opacity: .5; }
  </style>
</head>
<body>
  <h1>ChKSz 音源</h1>
  <div class="sub">搜索并播放 网易云 / QQ音乐 / 酷狗 歌曲(api.chksz.com)</div>

  <div class="card">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="api.chksz.com 登录后获取的个人密钥" autocomplete="off">
    <div class="hint">Key 保存在本服务端,不会写入插件代码</div>
    <label for="quality">默认音质</label>
    <select id="quality">
      <option value="flac">flac(无损,默认)</option>
      <option value="320k">320k</option>
      <option value="128k">128k</option>
    </select>
    <button id="saveBtn" onclick="save()" style="margin-top:12px">保存设置</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <div class="card">
    <div class="search-row">
      <input id="kw" placeholder="搜歌曲/歌手,如: 周杰伦 晴天" onkeydown="if(event.key==='Enter')search()">
      <button id="searchBtn" onclick="search()">搜索</button>
    </div>
    <div class="status muted" id="searchStatus"></div>
    <div id="results"></div>
  </div>

  <script>
    (function () {
      var BASE = window.location.pathname.replace(/\/+$/, '') + '/';

      function getToken() {
        try {
          var raw = localStorage.getItem('songloft-auth');
          if (!raw) return '';
          var obj = JSON.parse(raw);
          return obj && obj.accessToken ? obj.accessToken : '';
        } catch (e) { return ''; }
      }

      function api(path, opts) {
        opts = opts || {};
        var headers = opts.headers || {};
        var token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        if (opts.body) headers['Content-Type'] = 'application/json';
        return fetch(BASE + path, {
          method: opts.method || 'GET',
          headers: headers,
          body: opts.body || undefined,
        }).then(function (r) { return r.json().catch(function () { return null; }); });
      }

      var PLATFORM_NAME = { wy: '网易云', tx: 'QQ', kg: '酷狗' };

      // ===== 设置 =====
      window.loadSettings = function () {
        api('api/settings').then(function (data) {
          if (!data) return;
          var el = document.getElementById('apiKey');
          var q = document.getElementById('quality');
          if (data.api_key_set) el.placeholder = '已配置(' + data.api_key_mask + '),留空则不修改';
          if (data.quality) q.value = data.quality;
          var st = document.getElementById('saveStatus');
          st.textContent = data.api_key_set ? '已配置 Key,可直接搜索' : '请先配置 API Key';
          st.className = 'status ' + (data.api_key_set ? 'ok' : 'err');
        });
      };

      window.save = function () {
        var btn = document.getElementById('saveBtn');
        var st = document.getElementById('saveStatus');
        btn.disabled = true;
        st.textContent = '保存中...';
        st.className = 'status';
        var body = { quality: document.getElementById('quality').value };
        var key = document.getElementById('apiKey').value.trim();
        if (key) body.api_key = key;
        api('api/settings', { method: 'POST', body: JSON.stringify(body) }).then(function (data) {
          btn.disabled = false;
          if (data && data.ok) {
            st.textContent = '保存成功 ✓';
            st.className = 'status ok';
            document.getElementById('apiKey').value = '';
            loadSettings();
          } else {
            st.textContent = '保存失败:' + JSON.stringify(data) + '(若为 401,请重新打开插件页)';
            st.className = 'status err';
          }
        }).catch(function (e) {
          btn.disabled = false;
          st.textContent = '保存失败:' + e.message;
          st.className = 'status err';
        });
      };

      // ===== 搜索 =====
      window.search = function () {
        var kw = document.getElementById('kw').value.trim();
        var st = document.getElementById('searchStatus');
        var btn = document.getElementById('searchBtn');
        if (!kw) { st.textContent = '请输入关键词'; st.className = 'status err'; return; }
        btn.disabled = true;
        st.textContent = '搜索中...';
        st.className = 'status muted';
        api('api/search', { method: 'POST', body: JSON.stringify({ keyword: kw }) }).then(function (data) {
          btn.disabled = false;
          var results = (data && data.results) || [];
          if (!results.length) {
            st.textContent = '未找到结果(检查 API Key 是否有效)';
            st.className = 'status err';
            document.getElementById('results').innerHTML = '';
            return;
          }
          st.textContent = '找到 ' + results.length + ' 首,点击播放或加入队列';
          st.className = 'status ok';
          renderResults(results);
        }).catch(function (e) {
          btn.disabled = false;
          st.textContent = '搜索失败:' + e.message;
          st.className = 'status err';
        });
      };

      function renderResults(results) {
        var box = document.getElementById('results');
        var hasPlayer = !!(window.SongloftPlugin && window.SongloftPlugin.player);
        box.innerHTML = '';
        results.forEach(function (item, idx) {
          var platform = item.source_data ? item.source_data.platform : '';
          var pname = PLATFORM_NAME[platform] || platform || '未知';
          var div = document.createElement('div');
          div.className = 'item';
          div.innerHTML =
            '<span class="tag ' + platform + '">' + pname + '</span>' +
            '<div class="meta">' +
            '  <div class="t"></div>' +
            '  <div class="a"></div>' +
            '</div>' +
            '<div class="btns">' +
            (hasPlayer
              ? '<button class="ghost" data-action="play">播放</button><button class="ghost" data-action="queue">+队列</button>'
              : '<button class="ghost" data-action="import">导入曲库</button>') +
            '</div>';
          div.querySelector('.t').textContent = item.title;
          div.querySelector('.a').textContent = [item.artist, item.album].filter(Boolean).join(' · ');
          div.querySelectorAll('button').forEach(function (b) {
            b.onclick = function () { handleResult(item, b.getAttribute('data-action')); };
          });
          box.appendChild(div);
        });
      }

      function handleResult(item, action) {
        var st = document.getElementById('searchStatus');
        st.textContent = '处理中...';
        st.className = 'status muted';
        api('api/import', { method: 'POST', body: JSON.stringify({ song: item }) }).then(function (data) {
          if (!data || !data.ok || !data.id) {
            st.textContent = '导入失败:' + JSON.stringify(data);
            st.className = 'status err';
            return;
          }
          st.textContent = '已导入:' + data.title;
          st.className = 'status ok';
          var player = window.SongloftPlugin && window.SongloftPlugin.player;
          if (!player) return;
          if (action === 'queue') {
            player.addToQueue([data.id]);
            st.textContent = '已加入播放队列:' + data.title;
          } else {
            player.setQueue([data.id], { startIndex: 0 });
            st.textContent = '开始播放:' + data.title;
          }
        }).catch(function (e) {
          st.textContent = '导入失败:' + e.message;
          st.className = 'status err';
        });
      }

      document.addEventListener('DOMContentLoaded', loadSettings);
    })();
  </script>
</body>
</html>
